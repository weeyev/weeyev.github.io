<header id="header">

    <script data-goatcounter="https://weeye.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <script>
        (function () {
            var views = document.getElementById('page-views');
            var attempts = 0;

            function showPageViews() {
                if (!window.goatcounter || !window.goatcounter.get_data) {
                    if (attempts++ < 50) {
                        window.setTimeout(showPageViews, 100);
                    }
                    return;
                }

                var path = window.goatcounter.get_data().p;
                var counterUrl = 'https://weeye.goatcounter.com/counter/' +
                    encodeURIComponent(path) + '.json';

                window.fetch(counterUrl)
                    .then(function (response) {
                        if (!response.ok) throw new Error('Counter unavailable');
                        return response.json();
                    })
                    .then(function (data) {
                        views.textContent = data.count + ' views';
                        views.hidden = false;
                    })
                    .catch(function () {
                        views.hidden = true;
                    });
            }

            showPageViews();
        }());
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script>
        function stripHighlighting(pre) {
            var code = pre.querySelector('code');
            if (code) {
                code.innerHTML = code.textContent;
            }
        }
        function detectLanguage(pre, code) {
            var classes = [];
            if (pre && pre.classList) {
                classes = classes.concat(Array.from(pre.classList));
            }
            if (code && code.classList) {
                classes = classes.concat(Array.from(code.classList));
            }
            for (var i = 0; i < classes.length; i++) {
                var cls = classes[i];
                if (cls && cls !== 'sourceCode') {
                    return cls.toLowerCase();
                }
            }
            return null;
        }
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('pre').forEach(function(pre) {
                stripHighlighting(pre);
                var code = pre.querySelector('code');
                var lang = detectLanguage(pre, code);
                if (lang && code) {
                    code.className = 'language-' + lang;
                }
                if (pre.classList.contains('sourceCode')) {
                    pre.classList.remove('sourceCode');
                }
            });
            if (window.Prism) {
                if (Prism.plugins && Prism.plugins.autoloader) {
                    Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';
                }
                Prism.highlightAll();
            }
        });
    </script>
